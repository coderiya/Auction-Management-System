<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BuyMe Auction Platform</title>
    <link rel="stylesheet" href="../static/css/login.css">
    <link rel="stylesheet" href="../static/css/notification.css">
</head>

<body>
    <div class="main-container">
        <div id="login" class="screen active">
            <div class="login-container">
                <div class="login-header">
                    <h2>Welcome to BuyMe</h2>
                    <p>Sign in to start buying and selling</p>
                </div>
                <div class="login-body">
                    <div class="form-group">
                        <label class="form-label">User Name</label>
                        <input type="username" id="login-username" class="form-input" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="login-password" class="form-input" placeholder="Enter your password">
                    </div>

                    <button class="btn btn-primary btn-full" id="login-btn" onclick="users.login()">Sign in</button>

                    <div style="text-align: center; margin-top: 20px;">
                        <!-- <a href="#" style="color: #3665f3; font-size: 14px;">Forgot your password?</a> -->
                        <a href="#" id="forgot-password-link" style="color:#3665f3; font-size:14px;">Forgot your
                            password?</a>
                    </div>

                    <div
                        style="text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid #e5e5e5;">
                        <span style="color: #666; font-size: 14px;">New to BuyMe? </span>
                        <a href="register" style="color: #3665f3; font-size: 14px;">Create account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: white; padding: 20px; border-radius: 8px;">
            <div style="font-size: 24px;">Loading...</div>
        </div>
    </div>

    <!-- Forgot Password Screen -->
    <div id="forgot-password-screen" class="screen" style="display:none;">
        <div class="forgot-password-container">
            <button id="forgot-back-to-login" style="position:absolute; top:10px; left:10px;">&larr; Back</button>
            <h2>Reset Password</h2>
            <p>Enter your username to receive password reset instructions.</p>
            <input type="text" id="forgot-username" placeholder="Username" class="form-input" />
            <button id="submit-forgot" class="btn btn-primary btn-full">Submit</button>
        </div>
    </div>

    <!-- Reset Password Screen -->
    <div id="reset-password-screen" class="screen" style="display:none;">
        <div class="forgot-password-container">
            <button id="reset-back-to-login" class="back-button">&larr; Back</button>
            <h2>Reset Password</h2>
            <p>Enter your new password.</p>
            <input type="text" id="reset-username" placeholder="Enter your username" class="form-input" />
            <input type="password" id="new-password" placeholder="New password" class="form-input" />
            <button id="submit-reset" class="btn btn-primary">Reset Password</button>
        </div>
    </div>


    <script type="module" src="../static/js/users.js"></script>
    <script type="module">
        import { Users } from '../static/js/users.js';

        const users = new Users();
        window.users = users;

        // Show forgot password input screen
        document.getElementById('forgot-password-link').addEventListener('click', e => {
            e.preventDefault();
            showScreen('forgot-password-screen');
        });

        document.getElementById('forgot-back-to-login').addEventListener('click', e => {
            e.preventDefault();
            showScreen('login');
        });
        document.getElementById('reset-back-to-login').addEventListener('click', e => {
            e.preventDefault();
            showScreen('login');
        });

        // Submit username for password reset
        document.getElementById('submit-forgot').addEventListener('click', async () => {
            const username = document.getElementById('forgot-username').value.trim();
            const usernameExists = await users.checkUsername(username);
            if (usernameExists && usernameExists.status == 200) {
                document.getElementById('reset-username').value = username;
                showScreen('reset-password-screen');
            }
        });

        // Bind reset password submit once
        document.getElementById('submit-reset').addEventListener('click', async (e) => {
            e.preventDefault();
            const username = document.getElementById('reset-username').value.trim();
            const newPassword = document.getElementById('new-password').value.trim();

            const resetPassword = await users.resetPassword({ username, newPassword });
            if (resetPassword) {
                showScreen('login');
            }
        });

        function showScreen(screenId) {
            // Hide all screens
            document.querySelectorAll('.screen').forEach(screen => {
                screen.style.display = 'none';
                screen.classList.remove('active');
            });
            // Show target
            document.getElementById(screenId).style.display = 'block';
            document.getElementById(screenId).classList.add('active');
        }

    </script>
</body>

</html>
