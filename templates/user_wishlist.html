<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist</title>
    <link rel="stylesheet" href="./../static/css/list.css">
</head>

<body>
    <h2>Wishlist</h2>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search by name or description..." />

        <select id="categoryFilter">
            <option value="">All Categories</option>
        </select>

        <select id="sortSelect">
            <option value="recent">Sort by Recently Added</option>
            <option value="datetime">Sort by Date Time Added</option>
            <option value="name">Sort by Name</option>
            <option value="status">Sort by Status</option>
        </select>

    </div>

    <div id="itemsContainer" class="listing-list"></div>

    <div class="pagination">
        <button id="prevButton" class="page-btn">&lt;</button>
        <span id="pageNumber">1</span>
        <button id="nextButton" class="page-btn">&gt;</button>
    </div>

    <script type="module">
        import { All_Listings } from "../static/js/all_listings.js";

        const ALL_LISTINGS = new All_Listings();
        window.ALL_LISTINGS = ALL_LISTINGS;

        // SORT CHANGE
        document.getElementById("sortSelect").onchange = (e) => {
            ALL_LISTINGS.currentSort = e.target.value;
            ALL_LISTINGS.currentPage = 1;
            ALL_LISTINGS.loadListings();
        };

        // CATEGORY CHANGE
        document.getElementById("categoryFilter").onchange = (e) => {
            ALL_LISTINGS.currentCategory = e.target.value;
            ALL_LISTINGS.currentPage = 1;
            ALL_LISTINGS.loadListings();
        };

        // SEARCH CHANGE
        document.getElementById("searchBox").onkeyup = (e) => {
            ALL_LISTINGS.currentSearch = e.target.value.trim();
            ALL_LISTINGS.currentPage = 1;
            ALL_LISTINGS.loadListings();
        };

        // PAGINATION
        document.getElementById("prevButton").onclick = () => {
            if (ALL_LISTINGS.currentPage > 1) {
                ALL_LISTINGS.skip -= ALL_LISTINGS.limit;
                ALL_LISTINGS.currentPage--;
                ALL_LISTINGS.loadListings();
            }
        };

        document.getElementById("nextButton").onclick = () => {
            const maxPage = Math.ceil(ALL_LISTINGS.totalRecords / ALL_LISTINGS.pageSize);
            if (ALL_LISTINGS.currentPage < maxPage) {
                ALL_LISTINGS.skip += ALL_LISTINGS.limit;
                ALL_LISTINGS.currentPage++;
                ALL_LISTINGS.loadListings();
            }
        };

        // INITIAL LOAD
        window.onload = async () => {
            await ALL_LISTINGS.loadCategories();
            await ALL_LISTINGS.loadListings();
        };
    </script>
</body>

</html>
