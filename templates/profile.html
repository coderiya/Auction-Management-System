<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile - BuyMe Auctions</title>
  <style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #f4f4f9, #dce3f7);
    margin: 0;
    padding: 0;
    color: #333;
  }

  /* Navbar */
  .navbar {
    background: #2c3e50;
    color: white;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .navbar .logo {
    font-size: 1.6rem;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .nav-links a {
    color: white;
    margin-left: 20px;
    text-decoration: none;
    font-size: 1rem;
    transition: color 0.3s ease;
  }

  .nav-links a:hover,
  .nav-links a.active {
    color: #f1c40f;
  }

  /* Profile Card */
  .profile-container {
    max-width: 600px;
    margin: 50px auto;
    background: #ffffff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    animation: fadeIn 0.8s ease-in-out;
  }

  .profile-container h2 {
    margin-bottom: 25px;
    color: #2c3e50;
    text-align: center;
    font-size: 1.8rem;
    border-bottom: 2px solid #3b4d75;
    padding-bottom: 10px;
  }

  /* Profile details in two-column layout */
  .profile-details {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.profile-details p {
  font-size: 16px;
  margin: 0;
  padding: 12px 16px;
  background: #f0f4ff;
  border-left: 4px solid #3b4d75;
  border-radius: 6px;
  color: #2c3e50;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}

.profile-details strong {
  color: #3b4d75;
  font-weight: 600;
}

  /* Footer */
  .footer {
    text-align: center;
    padding: 20px;
    background: #2c3e50;
    color: #ddd;
    margin-top: 60px;
    font-size: 14px;
  }

  /* Animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">BuyMe</div>
    <div class="nav-links">
      <a href="home">Home</a>
      <a href="wishlist">Wishlist</a>
      <a href="profile" class="active">Profile</a>
    </div>
  </nav>

  <!-- Profile Section -->
  <div class="profile-container">
    <h2>User Profile</h2>
    <div id="profileDetails" class="profile-details"></div>
  </div>

  <!-- Footer -->
  <!-- <div class="footer">
    &copy; 2024 BuyMe Auctions. All rights reserved.
  </div> -->

  <!-- Script to fetch and display user data -->
  <script>
  async function fetchUserDet(){
      try{
          const user_id = localStorage.getItem('USER_ID');
          let url = `/users/${user_id}`;
          const response = await fetch(url,{
              method:'GET',
              headers: {'Content-Type': 'application/json'}
          });
          console.log('response:',response);

          const user = (await response.json())?.data;
          return user;
      } catch(error){
          console.log(error);
      }
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const user = await fetchUserDet();
    const a = document.getElementById("profileDetails");
    a.innerHTML = `
      <p><strong>Name:</strong> ${user.USER_NAME}</p>
      <p><strong>Email:</strong> ${user.USER_EMAIL}</p>
      <p><strong>Phone:</strong> ${user.USER_PHONE}</p>
    `;
  });
</script>

</body>
</html>
