<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="../static/css/login.css">
  <link rel="stylesheet" href="../static/css/notification.css">
</head>
<body>
  <div class="main-container">
    <div class="login-container">
      <div class="login-header">
        <h2>Create Your Account</h2>
      </div>

      <div class="login-body">
        <form id="registerForm">
          <div class="form-group">
            <label class="form-label">Email address</label>
            <input type="email" id="reg_email" class="form-input" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label class="form-label">User Name</label>
            <input type="username" id="reg_username" class="form-input" placeholder="Enter your username" required>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="reg_password" class="form-input" placeholder="Enter your password" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="username" id="reg_phone" class="form-input" placeholder="Enter your Phone No." required>
          </div>
          <div class="form-group">
            <label class="form-label">Address</label>
            <input type="username" id="reg_address" class="form-input" placeholder="Enter your address" required>
          </div>

          <!-- <div class="form-group">
            <label class="form-label">User Type</label>
            <select id="reg_type" class="form-input" required>
              <option value="A">Type A</option>
              <option value="B">Type B</option>
            </select>
          </div> -->

          <button type="button" id = 'submit-register' class="btn btn-primary btn-full">Register</button>
        </form>

        <div class="register-section">
          <span>Already have an account? </span>
          <a href="/" class="register-link">Login here</a>
        </div>

        <div id="register-message" class="error-message"></div>
      </div>
    </div>
  </div>

  <!-- <script type="module" src="../static/js/users.js"></script> -->
    <script type="module">
        import { Users } from '../static/js/users.js';

        const users = new Users();
        window.users = users;

        document.getElementById('submit-register').addEventListener('click', async(e)=>{
          e.preventDefault();
          // const username = document.getElementById('reg_username').value.trim();
          // const password = document.getElementById('reg_password').value.trim();
          // const email = document.getElementById('reg_email').value.trim();
          const params = {
            userName: document.getElementById('reg_username').value.trim(),
            userEmail: document.getElementById('reg_email').value.trim(),
            userPassword: document.getElementById('reg_password').value.trim(),
            userPhone: document.getElementById('reg_phone').value.trim(),
            userAddress: document.getElementById('reg_address').value.trim()
          }
          const userRegister = await users.register(params);
          if (userRegister) {
              showScreen('login');
          }
        })

    </script>
</body>
</html>
